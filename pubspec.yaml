name: nlaptxd
description: "NLapt 标注台:图片 + 同名 .txt 训练集的自然语言标注编辑器"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter_onnxruntime: ^1.9.0
  path_provider: ^2.1.6
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wordmark.png
  fonts:
    - family: Maple Mono
      fonts:
        - asset: fonts/MapleMono-Regular.ttf
    - family: LXGW 975 Yuan SC
      fonts:
        - asset: fonts/LXGW975YuanSC-500W.ttf
